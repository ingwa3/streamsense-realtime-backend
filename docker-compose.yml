name: streamsense

x-app-service: &app-service
  image: streamsense-app:2.0.0
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - streamsense_backend
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  broker:
    image: apache/kafka:4.3.1
    hostname: broker
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://broker:19092"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker:29093"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 30s
    networks:
      - streamsense_backend
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  topic-init:
    image: apache/kafka:4.3.1
    depends_on:
      broker:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:19092 --create --if-not-exists --topic sensor-readings.v1 --partitions 6 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:19092 --create --if-not-exists --topic sensor-readings.dlq.v1 --partitions 3 --replication-factor 1 --config retention.ms=2592000000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:19092 --list
    restart: "no"
    networks:
      - streamsense_backend

  postgres:
    image: postgres:16.14-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      STREAMSENSE_WRITER_PASSWORD: ${STREAMSENSE_WRITER_PASSWORD}
      STREAMSENSE_AGGREGATOR_PASSWORD: ${STREAMSENSE_AGGREGATOR_PASSWORD}
      STREAMSENSE_READER_PASSWORD: ${STREAMSENSE_READER_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - streamsense_backend
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  producer:
    <<: *app-service
    command: ["python", "-m", "streamsense.producer.main"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-broker:19092}
      INPUT_TOPIC: ${INPUT_TOPIC:-sensor-readings.v1}
      PRODUCER_INSTANCE: ${PRODUCER_INSTANCE:-simulator-01}
      SENSOR_COUNT: ${SENSOR_COUNT:-500}
      ROOM_COUNT: ${ROOM_COUNT:-50}
      EVENTS_PER_SECOND: ${EVENTS_PER_SECOND:-250}
      TOTAL_EVENTS: ${TOTAL_EVENTS:-0}
      BURST_MODE: ${BURST_MODE:-false}
      RANDOM_SEED: ${RANDOM_SEED:-42}
      LATE_EVENT_PROBABILITY: ${LATE_EVENT_PROBABILITY:-0.02}
      LATE_EVENT_MAX_SECONDS: ${LATE_EVENT_MAX_SECONDS:-90}
    depends_on:
      topic-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9101/metrics', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  persister:
    <<: *app-service
    command: ["python", "-m", "streamsense.persister.main"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-broker:19092}
      INPUT_TOPIC: ${INPUT_TOPIC:-sensor-readings.v1}
      DLQ_TOPIC: ${DLQ_TOPIC:-sensor-readings.dlq.v1}
      CONSUMER_GROUP: ${CONSUMER_GROUP:-streamsense-persister-v2}
      DATABASE_URL: ${PERSISTER_DATABASE_URL}
      PERSIST_BATCH_SIZE: ${PERSIST_BATCH_SIZE:-1000}
      PERSIST_FLUSH_SECONDS: ${PERSIST_FLUSH_SECONDS:-1.0}
      COMFORT_TEMPERATURE_MIN_C: ${COMFORT_TEMPERATURE_MIN_C:-18}
      COMFORT_TEMPERATURE_MAX_C: ${COMFORT_TEMPERATURE_MAX_C:-27}
      COMFORT_HUMIDITY_MIN_PCT: ${COMFORT_HUMIDITY_MIN_PCT:-30}
      COMFORT_HUMIDITY_MAX_PCT: ${COMFORT_HUMIDITY_MAX_PCT:-70}
      CO2_WARNING_PPM: ${CO2_WARNING_PPM:-1200}
    depends_on:
      topic-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9102/metrics', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  aggregator:
    <<: *app-service
    command: ["python", "-m", "streamsense.aggregator.main"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${AGGREGATOR_DATABASE_URL}
      AGGREGATION_INTERVAL_SECONDS: ${AGGREGATION_INTERVAL_SECONDS:-5}
      ALLOWED_LATENESS_SECONDS: ${ALLOWED_LATENESS_SECONDS:-15}
      AGGREGATION_LOOKBACK_MINUTES: ${AGGREGATION_LOOKBACK_MINUTES:-10}
      RAW_RETENTION_DAYS: ${RAW_RETENTION_DAYS:-30}
      AGGREGATE_RETENTION_DAYS: ${AGGREGATE_RETENTION_DAYS:-365}
      COMFORT_TEMPERATURE_MIN_C: ${COMFORT_TEMPERATURE_MIN_C:-18}
      COMFORT_TEMPERATURE_MAX_C: ${COMFORT_TEMPERATURE_MAX_C:-27}
      COMFORT_HUMIDITY_MIN_PCT: ${COMFORT_HUMIDITY_MIN_PCT:-30}
      COMFORT_HUMIDITY_MAX_PCT: ${COMFORT_HUMIDITY_MAX_PCT:-70}
      CO2_WARNING_PPM: ${CO2_WARNING_PPM:-1200}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9103/metrics', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    <<: *app-service
    command: ["python", "-m", "streamsense.api.main"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${API_DATABASE_URL}
      REPORTING_API_KEY: ${REPORTING_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  prometheus:
    image: prom/prometheus:v3.13.2
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - producer
      - persister
      - aggregator
      - api
    networks:
      - streamsense_backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  streamsense_backend:
    driver: bridge

volumes:
  kafka_data:
  postgres_data:
  prometheus_data:




