[project]
name = "streamsense-realtime-backend"
version = "2.0.0"
description = "Reproducible near-real-time backend for simulated indoor-air sensor data"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
